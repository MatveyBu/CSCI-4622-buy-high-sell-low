[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhsl"
version = "0.1.0"
description = "Buy High, Sell Low: does international market information help predict US stock outperformance?"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["bhsl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
